version: "3.8"

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: 2scalte18#
      MYSQL_DATABASE: superhero_db 
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./superhero_db.sql:/docker-entrypoint-initdb.d/superhero_db.sql

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_data: 
